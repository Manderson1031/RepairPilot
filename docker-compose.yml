services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: repairpilot
      POSTGRES_USER: repairpilot
      POSTGRES_PASSWORD: repairpilot_dev
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U repairpilot -d repairpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - repairpilot_pg:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      REPAIRPILOT_ENV: development
      REPAIRPILOT_SECRET: local-compose-secret-change-in-production
      DATABASE_URL: postgresql://repairpilot:repairpilot_dev@db:5432/repairpilot
      REPAIRPILOT_STORAGE_BACKEND: local
      REPAIRPILOT_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8000:8000"
    volumes:
      - repairpilot_files:/app/data

volumes:
  repairpilot_pg:
  repairpilot_files:
