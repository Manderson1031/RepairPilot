name: RepairPilot iOS Native

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/modules/**'
      - 'mobile/app/ar-assist.tsx'
      - 'mobile/app/lidar-measure.tsx'
      - 'mobile/src/arAssist.ts'
      - 'mobile/src/lidarScanner.ts'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/ios-native.yml'
  pull_request:
    paths:
      - 'mobile/modules/**'
      - 'mobile/app/ar-assist.tsx'
      - 'mobile/app/lidar-measure.tsx'
      - 'mobile/src/arAssist.ts'
      - 'mobile/src/lidarScanner.ts'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/ios-native.yml'

# Native compile gate for the local ARKit/LiDAR Expo modules.
# Expo SDK 57's ExpoModulesJSI package requires Swift tools 6.2. The macOS 15
# image includes Xcode 26.3, so select it explicitly instead of the Xcode 16.4 default.
jobs:
  ios-native-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select Swift 6.2 capable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun swiftc --version
      - run: npm ci
      - name: Generate iOS project and autolink local Expo modules
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Build iOS simulator app
        id: xcodebuild
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/RepairPilot.xcworkspace \
            -scheme RepairPilot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/repairpilot-xcode.log
      - name: Capture native build diagnostics
        if: failure()
        run: |
          {
            echo '===== RepairPilot native build diagnostics ====='
            echo '===== Toolchain ====='
            xcodebuild -version || true
            xcrun swiftc --version || true
            if [ -f /tmp/repairpilot-xcode.log ]; then
              grep -nE '(^| )(error:|fatal error:|SwiftCompile|CompileSwift|SwiftEmitModule|PhaseScriptExecution|Could not resolve package dependencies|RepairPilot(Lidar|AR)|BUILD FAILED|The following build commands failed)' /tmp/repairpilot-xcode.log | tail -n 350 || true
              echo '===== Swift package failure context ====='
              grep -n -B 30 -A 50 'Could not resolve package dependencies' /tmp/repairpilot-xcode.log | tail -n 120 || true
              echo '===== ExpoModulesJSI failure context ====='
              grep -n -B 30 -A 50 'ExpoModulesJSI' /tmp/repairpilot-xcode.log | tail -n 160 || true
              echo '===== Last 200 build lines ====='
              tail -n 200 /tmp/repairpilot-xcode.log || true
            else
              echo 'xcodebuild log was not created.'
            fi
          } | tee native-build-errors.txt
      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repairpilot-native-build-errors
          path: mobile/native-build-errors.txt
          if-no-files-found: error
          retention-days: 3
