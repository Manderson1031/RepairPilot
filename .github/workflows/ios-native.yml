name: RepairPilot iOS Native

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/modules/**'
      - 'mobile/app/ar-assist.tsx'
      - 'mobile/app/lidar-measure.tsx'
      - 'mobile/src/arAssist.ts'
      - 'mobile/src/lidarScanner.ts'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/ios-native.yml'
  pull_request:
    paths:
      - 'mobile/modules/**'
      - 'mobile/app/ar-assist.tsx'
      - 'mobile/app/lidar-measure.tsx'
      - 'mobile/src/arAssist.ts'
      - 'mobile/src/lidarScanner.ts'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/ios-native.yml'

# Native compile gate for the local ARKit/LiDAR Expo modules.
jobs:
  ios-native-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate iOS project and autolink local Expo modules
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Build iOS simulator app
        id: xcodebuild
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/RepairPilot.xcworkspace \
            -scheme RepairPilot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/repairpilot-xcode.log
      - name: Print native build errors
        if: failure()
        run: |
          echo '===== RepairPilot native build diagnostics ====='
          if [ -f /tmp/repairpilot-xcode.log ]; then
            grep -nE '(^| )(error:|fatal error:|SwiftCompile|CompileSwift|RepairPilot(Lidar|AR)|BUILD FAILED|The following build commands failed)' /tmp/repairpilot-xcode.log | tail -n 250 || true
            echo '===== Last 120 build lines ====='
            tail -n 120 /tmp/repairpilot-xcode.log || true
          else
            echo 'xcodebuild log was not created.'
          fi
