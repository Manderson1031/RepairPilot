name: One-time StyleSheet compatibility patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace removed absoluteFillObject API
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('mobile/app').glob('*.tsx'):
              text = path.read_text()
              new = text.replace('StyleSheet.absoluteFillObject', 'StyleSheet.absoluteFill')
              if new != text:
                  path.write_text(new)
                  changed.append(str(path))
          print('Patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then
            echo "No compatibility changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app/*.tsx
          git commit -m "Fix React Native StyleSheet absolute fill compatibility"
          git push
