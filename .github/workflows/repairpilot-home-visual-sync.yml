             '''featureGrid:{flexDirection:'row',flexWrap:'wrap',gap:7},featureTile:{width:'32%',minHeight:174,borderWidth:1,borderColor:'rgba(181,120,13,.82)',borderRadius:4,backgroundColor:'rgba(11,13,14,.84)',paddingHorizontal:6,paddingVertical:12,alignItems:'center',justifyContent:'center',position:'relative',shadowColor:'#000',shadowOpacity:.32,shadowRadius:5,shadowOffset:{width:0,height:3}},featureIconBox:{width:52,height:50,alignItems:'center',justifyContent:'center',marginBottom:9},featureIconText:{color:'#f5aa00',fontSize:42,fontWeight:'700'},featureTitle:{color:'#efefec',fontFamily:Platform.select({ios:'AvenirNextCondensed-DemiBold',android:'sans-serif-condensed'}),fontWeight:'900',fontSize:14.5,lineHeight:17,textAlign:'center',letterSpacing:.05,textShadowColor:'rgba(0,0,0,.9)',textShadowRadius:2},featureSub:{color:'#c0c2c2',fontFamily:Platform.select({ios:'AvenirNextCondensed-Medium',android:'sans-serif-condensed'}),fontSize:12,lineHeight:15.5,textAlign:'center',marginTop:7},newBadge:{position:'absolute',right:5,top:5,backgroundColor:'#f4aa00',color:'#111',fontWeight:'900',fontSize:10,paddingHorizontal:6,paddingVertical:3,borderRadius:10},'''),

            ('''activityHeader:{flexDirection:'row',alignItems:'center',justifyContent:'space-between',marginTop:15,marginBottom:7},viewAll:{color:'#ffb000',fontSize:9,fontWeight:'900'},recentRow:{minHeight:54,flexDirection:'row',alignItems:'center',gap:9,borderWidth:1,borderColor:'#3e4446',backgroundColor:'rgba(12,15,16,.97)',paddingHorizontal:10,paddingVertical:7},historyRow:{minHeight:64,flexDirection:'row',alignItems:'center',gap:10,borderWidth:1,borderColor:'#3e4446',backgroundColor:'rgba(12,15,16,.97)',paddingHorizontal:10,paddingVertical:8,marginBottom:5},historyIcon:{width:38,alignItems:'center'},recentInfo:{flex:1},recentTitle:{color:'#f5f5f2',fontSize:12,fontWeight:'800'},recentSub:{color:'#9ca2a4',fontSize:9,marginTop:2},recentStatus:{alignItems:'flex-end'},completed:{color:'#76d34f',fontSize:9,fontWeight:'900'},inProgress:{color:'#5db9e8',fontSize:9,fontWeight:'900'},recentDate:{color:'#a9adae',fontSize:8,marginTop:2},''',
             '''activityHeader:{flexDirection:'row',alignItems:'center',justifyContent:'space-between',marginTop:17,marginBottom:8,paddingHorizontal:2},viewAll:{color:'#f0a800',fontSize:12,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900'},recentRow:{minHeight:64,flexDirection:'row',alignItems:'center',gap:10,borderWidth:1,borderColor:'rgba(74,80,82,.88)',borderRadius:4,backgroundColor:'rgba(10,13,14,.88)',paddingHorizontal:10,paddingVertical:8,marginBottom:4},historyRow:{minHeight:64,flexDirection:'row',alignItems:'center',gap:10,borderWidth:1,borderColor:'#3e4446',backgroundColor:'rgba(12,15,16,.94)',paddingHorizontal:10,paddingVertical:8,marginBottom:5},historyIcon:{width:38,alignItems:'center'},recentInfo:{flex:1},recentTitle:{color:'#efefec',fontFamily:Platform.select({ios:'AvenirNextCondensed-DemiBold',android:'sans-serif-condensed'}),fontSize:15,fontWeight:'900',textShadowColor:'rgba(0,0,0,.9)',textShadowRadius:2},recentSub:{color:'#adb0b0',fontFamily:Platform.select({ios:'AvenirNextCondensed-Medium',android:'sans-serif-condensed'}),fontSize:11,marginTop:1},recentStatus:{alignItems:'flex-end'},completed:{color:'#75d552',fontSize:11,fontWeight:'900'},inProgress:{color:'#55b8e8',fontSize:11,fontWeight:'900'},recentDate:{color:'#b1b3b2',fontSize:10,marginTop:2},'''),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          p.write_text(text)
          PY

      - name: Commit approved visual pass
        run: |
          git config user.name "RepairPilot Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/app/index.tsx
          git diff --cached --check
          git commit -m "Match approved RepairPilot home reference"
          git push origin HEAD:main
