name: Apply approved RepairPilot home visual target

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repairpilot-home-visual-sync.yml'

permissions:
  contents: write

jobs:
  sync-home-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match approved home-screen reference
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('mobile/app/index.tsx')
          text = p.read_text()

          replacements = [
            ('''   <FeatureTile icon="brain" title="AI DIAGNOSIS" sub="Start a new diagnostic" onPress={async()=>{await loadEquipment();nav('equipment')}}/>\n   <FeatureTile icon="line-scan" title="HARDWARE SCANNER" sub="Identify parts" badge="NEW" onPress={()=>nav('scanner')}/>\n   <FeatureTile icon="cube-scan" title="AR ASSISTANT" sub="Visual guidance" badge="NEW" onPress={()=>nav('ar')}/>\n   <FeatureTile icon="tractor" title="MY EQUIPMENT" sub="Manage machines" onPress={async()=>{await loadEquipment();nav('equipment')}}/>\n   <FeatureTile icon="clipboard-text-outline" title="DIAGNOSTICS" sub="Repairs & reports" onPress={loadHistory}/>\n   <FeatureTile icon="calendar-clock-outline" title="MAINTENANCE" sub="Service reminders" onPress={()=>nav('maintenance')}/>''',
             '''   <FeatureTile icon="brain" title="AI DIAGNOSIS" sub="Start a new diagnostic" onPress={async()=>{await loadEquipment();nav('equipment')}}/>\n   <FeatureTile icon="lightning-bolt" title="HARDWARE SCANNER" sub="Identify hardware & find parts" badge="NEW" onPress={()=>nav('scanner')}/>\n   <FeatureTile icon="cube-scan" title="AR REPAIR ASSISTANT" sub="Visual guidance in real world" onPress={()=>nav('ar')}/>\n   <FeatureTile icon="excavator" title="MY EQUIPMENT" sub="Manage your equipment" onPress={async()=>{await loadEquipment();nav('equipment')}}/>\n   <FeatureTile icon="clipboard-text-clock-outline" title="MY DIAGNOSTICS" sub="View past diagnostics" onPress={loadHistory}/>\n   <FeatureTile icon="tools" title="MAINTENANCE" sub="Schedules & reminders" onPress={()=>nav('maintenance')}/>'''),

            ('''const BottomNav=({active}:{active:string})=><View style={s.bottomNav}>{([['home','home','Home'],['equipment','tractor','Equipment'],['history','shield-wrench-outline','Diagnosis'],['scanner','line-scan','Scanner'],['ar','cube-scan','AR Assist'],['settings','account-outline','Profile']] as const).map(([key,icon,label])=><TouchableOpacity key={key} style={s.navItem} onPress={()=>key==='scanner'?nav('scanner'):key==='equipment'?(loadEquipment(),nav('equipment')):key==='history'?loadHistory():nav(key as Screen)}><MaterialCommunityIcons name={icon as any} size={18} color={active===key?'#ffb000':'#858b8d'}/><Text style={[s.navLabel,active===key&&s.navActive]}>{label}</Text></TouchableOpacity>)}</View>;''',
             '''const BottomNav=({active}:{active:string})=><View style={s.bottomNav}>{([['home','home','Home'],['equipment','excavator','Equipment'],['history','shield-wrench-outline','Diagnosis'],['scanner','line-scan','Scanner'],['ar','cube-scan','AR Assist'],['settings','account-outline','Profile']] as const).map(([key,icon,label])=><TouchableOpacity key={key} style={s.navItem} onPress={()=>key==='scanner'?nav('scanner'):key==='equipment'?(loadEquipment(),nav('equipment')):key==='history'?loadHistory():nav(key as Screen)}><MaterialCommunityIcons name={icon as any} size={22} color={active===key?'#ffb000':'#8b8f90'}/><Text style={[s.navLabel,active===key&&s.navActive]}>{label}</Text></TouchableOpacity>)}</View>;'''),

            ('''gearLayer:{...StyleSheet.absoluteFill,overflow:'hidden',backgroundColor:'#090b0d'},bgImage:{opacity:.82},bgShade:{...StyleSheet.absoluteFill,backgroundColor:'rgba(4,6,7,.08)'},''',
             '''gearLayer:{...StyleSheet.absoluteFill,overflow:'hidden',backgroundColor:'#07090a'},bgImage:{opacity:.72},bgShade:{...StyleSheet.absoluteFill,backgroundColor:'rgba(3,4,5,.20)'},'''),

            ('''topBar:{height:64,flexDirection:'row',alignItems:'center',justifyContent:'space-between',paddingHorizontal:9,borderBottomWidth:1,borderBottomColor:'rgba(255,176,0,.62)',backgroundColor:'rgba(7,9,10,.98)'},wordmarkRow:{flexDirection:'row',alignItems:'center',gap:5},wordmarkIcon:{display:'none',width:0,height:0},topBrand:{color:'#f5f5f2',fontSize:23,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900',fontStyle:'italic',letterSpacing:-.3},topIcon:{color:'#e9e9e5',fontSize:23,minWidth:26,textAlign:'center'},topHit:{width:42,height:42,alignItems:'center',justifyContent:'center'},''',
             '''topBar:{height:66,flexDirection:'row',alignItems:'center',justifyContent:'space-between',paddingHorizontal:10,borderBottomWidth:1,borderBottomColor:'rgba(214,143,0,.70)',backgroundColor:'rgba(5,7,8,.91)'},wordmarkRow:{flexDirection:'row',alignItems:'center',gap:5},wordmarkIcon:{display:'none',width:0,height:0},topBrand:{color:'#ececea',fontSize:30,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900',fontStyle:'italic',letterSpacing:-.7,textShadowColor:'rgba(0,0,0,.95)',textShadowRadius:3},topIcon:{color:'#e4e4df',fontSize:25,minWidth:28,textAlign:'center'},topHit:{width:44,height:44,alignItems:'center',justifyContent:'center'},'''),

            ('''bottomNav:{height:64,flexDirection:'row',borderTopWidth:1,borderTopColor:'#3f4446',backgroundColor:'rgba(7,9,10,.99)',paddingBottom:4},navItem:{flex:1,alignItems:'center',justifyContent:'center'},navIcon:{color:'#8c9295',fontSize:19},navLabel:{color:'#858b8d',fontSize:8,marginTop:3,fontWeight:'800'},navActive:{color:'#ffb000'},''',
             '''bottomNav:{height:72,flexDirection:'row',borderTopWidth:1,borderTopColor:'rgba(184,121,0,.42)',backgroundColor:'rgba(5,7,8,.94)',paddingBottom:5},navItem:{flex:1,alignItems:'center',justifyContent:'center'},navIcon:{color:'#8c9295',fontSize:22},navLabel:{color:'#8f9394',fontSize:10,marginTop:3,fontFamily:Platform.select({ios:'AvenirNextCondensed-DemiBold',android:'sans-serif-condensed'}),fontWeight:'800'},navActive:{color:'#ffb000'},'''),

            ('''dashboardWrap:{paddingHorizontal:12,paddingTop:10,paddingBottom:76},welcomeBlock:{minHeight:108,paddingHorizontal:2,paddingTop:12,paddingBottom:14,borderBottomWidth:1,borderBottomColor:'rgba(255,176,0,.38)',justifyContent:'center'},welcomeSmall:{color:'#d6d7d5',fontSize:12},welcomeName:{color:'#fff',fontSize:30,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900'},welcomeSub:{color:'#b0b4b5',fontSize:12,marginTop:2},sectionHeader:{flexDirection:'row',alignItems:'center',gap:8,marginTop:13,marginBottom:8},sectionTitle:{color:'#ffb000',fontSize:15,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900',letterSpacing:.45},sectionRail:{height:1,flex:1,backgroundColor:'rgba(255,176,0,.43)',borderRightWidth:24,borderRightColor:'rgba(112,116,116,.28)'},''',
             '''dashboardWrap:{paddingHorizontal:12,paddingTop:8,paddingBottom:84},welcomeBlock:{minHeight:146,paddingHorizontal:8,paddingTop:16,paddingBottom:18,borderBottomWidth:0,justifyContent:'center'},welcomeSmall:{color:'#d0d1cf',fontSize:16,fontFamily:Platform.select({ios:'AvenirNextCondensed-DemiBold',android:'sans-serif-condensed'}),textShadowColor:'rgba(0,0,0,.95)',textShadowRadius:3},welcomeName:{color:'#f2f2ef',fontSize:35,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900',letterSpacing:.2,textShadowColor:'rgba(0,0,0,.95)',textShadowRadius:4},welcomeSub:{color:'#c0c2c1',fontSize:15,marginTop:2,fontFamily:Platform.select({ios:'AvenirNextCondensed-DemiBold',android:'sans-serif-condensed'}),textShadowColor:'rgba(0,0,0,.95)',textShadowRadius:3},sectionHeader:{flexDirection:'row',alignItems:'center',gap:10,marginTop:11,marginBottom:9,paddingHorizontal:2},sectionTitle:{color:'#f2a900',fontSize:18,fontFamily:Platform.select({ios:'AvenirNextCondensed-Heavy',android:'sans-serif-condensed'}),fontWeight:'900',letterSpacing:.25,textShadowColor:'rgba(0,0,0,.9)',textShadowRadius:2},sectionRail:{height:1,flex:1,backgroundColor:'rgba(222,149,0,.62)'},'''),

