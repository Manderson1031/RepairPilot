name: Prepare iOS Dev Client Dependency

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-ios-dev-client.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo SDK 57 development client
        run: npm install expo-dev-client@~57.0.18 --save
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: repairpilot-ios-dev-client-manifests
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
