name: RepairPilot iPhone Preview Build

on:
  workflow_dispatch:

jobs:
  eas-ios-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install project dependencies
        run: npm ci
      - name: Apply approved target dashboard geometry
        run: node scripts/apply-target-home.js
      - name: Preflight iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist-ios
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build installable iPhone preview
        run: eas build --platform ios --profile preview --non-interactive
