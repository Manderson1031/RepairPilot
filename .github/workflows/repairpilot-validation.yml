name: RepairPilot validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  hardware-backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run hardware measurement, fusion, thread, matching and replacement tests
        run: >-
          pytest -q
          tests/test_hardware_depth.py
          tests/test_hardware_measurement.py
          tests/test_hardware_matching.py
          tests/test_thread_vision.py
          tests/test_hardware_replacement.py
