name: Inspect RepairPilot EAS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-eas-build.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Inspect failed EAS build
        working-directory: mobile
        run: |
          eas build:view 31505fad-a8d7-4cfc-810c-d53bf8ecb30e --json || true
