<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>RepairPilot Target Review</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}body{min-height:100vh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}header{text-align:center;padding:10px 0 8px}h1{margin:0;font-size:20px;font-style:italic}h1 b{color:#ffad00}p{margin:4px 0 0;color:#9c988f;font-size:11px}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0 10px}.tabs button{white-space:nowrap;background:#0b0c0d;color:#aaa;border:1px solid #62440d;border-radius:5px;padding:8px 10px;font-weight:800;font-size:10px}.tabs button.on{color:#ffad00;border-color:#ffad00}.stage{display:flex;justify-content:center}.phone{position:relative;width:min(94vw,420px);aspect-ratio:255/518;overflow:hidden;background:#000;border:1px solid #7c520c;box-shadow:0 0 24px #000}.master{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}.hint{text-align:center;color:#8e8a82;font-size:11px;padding:10px 20px 16px}.screenName{text-align:center;color:#ffad00;font-weight:900;font-size:14px;padding:2px 0 8px}.hot{position:absolute;background:transparent;border:0;z-index:5}.hot:active{background:rgba(255,173,0,.08)}</style></head><body><header><h1>REPAIR<b>PILOT</b> VISUAL REVIEW</h1><p>Approved target artwork • zero EAS usage</p></header><div class="tabs" id="tabs"></div><div class="screenName" id="screenName"></div><div class="stage"><div class="phone" id="phone"><img class="master" id="master" src="https://raw.githubusercontent.com/Manderson1031/RepairPilot/target-dashboard-proof/mobile/assets/repairpilot-v27-design-master.png" alt="RepairPilot target"></div></div><div class="hint">Tap the tabs to review every approved screen. Dashboard hotspots also navigate to Equipment, Diagnosis, Scanner, AR, History and Maintenance.</div><script>const M={w:1536,h:1024};const screens={login:{label:'LOGIN',x:10,y:146,w:242,h:518},dashboard:{label:'DASHBOARD',x:260,y:146,w:255,h:518},equipment:{label:'EQUIPMENT LIST',x:525,y:146,w:251,h:518},diagnosis:{label:'AI DIAGNOSIS',x:783,y:146,w:240,h:518},scanner:{label:'SCANNER',x:1027,y:146,w:255,h:518},scanresult:{label:'SCAN RESULT',x:1288,y:146,w:243,h:518},ar:{label:'AR REPAIR ASSISTANT',x:505,y:697,w:346,h:238},history:{label:'DIAGNOSTIC HISTORY',x:868,y:697,w:339,h:238},maintenance:{label:'MAINTENANCE',x:1217,y:697,w:313,h:238}};const order=Object.keys(screens);const tabs=document.getElementById('tabs'),phone=document.getElementById('phone'),img=document.getElementById('master'),nameEl=document.getElementById('screenName');let active='dashboard';order.forEach(k=>{const b=document.createElement('button');b.textContent=screens[k].label;b.onclick=()=>show(k);b.dataset.k=k;tabs.appendChild(b)});function hotspots(k){phone.querySelectorAll('.hot').forEach(x=>x.remove());if(k!=='dashboard')return;[['equipment',0,.40,.33,.25],['diagnosis',.34,.40,.33,.25],['scanner',.67,.40,.33,.25],['ar',0,.65,.33,.25],['history',.34,.65,.33,.25],['maintenance',.67,.65,.33,.25]].forEach(([to,l,t,w,h])=>{const b=document.createElement('button');b.className='hot';b.style.left=l*100+'%';b.style.top=t*100+'%';b.style.width=w*100+'%';b.style.height=h*100+'%';b.onclick=()=>show(to);phone.appendChild(b)})}function show(k){active=k;const c=screens[k];nameEl.textContent=c.label;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));requestAnimationFrame(()=>{const W=phone.clientWidth,H=phone.clientHeight;const scale=Math.max(W/c.w,H/c.h);img.style.width=(M.w*scale)+'px';img.style.height=(M.h*scale)+'px';img.style.left=(-c.x*scale)+'px';img.style.top=(-c.y*scale)+'px';});hotspots(k)}window.addEventListener('resize',()=>show(active));show(active);</script></body></html>
